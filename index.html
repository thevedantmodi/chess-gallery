<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Chess</title>
<meta name="description" content="Play and review chess offline.">
<meta name="theme-color" content="#ededeb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chess">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<script>
// Before first paint, so the page never flashes the wrong theme .
(function(){try{var m=localStorage.getItem('theme-manual')==='1';var s=localStorage.getItem('theme');var t=m&&(s==='light'||s==='dark')?s:(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="shell">
  <header class="sh">
    <button class="sh-logo" id="logo" aria-label="Chess">
      <svg class="mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7"/><rect class="mk" x="13" y="1" width="12" height="12" fill="currentColor" stroke="none"/><rect class="mk" x="1" y="13" width="12" height="12" fill="currentColor" stroke="none"/></svg>
      <span>Chess</span>
    </button>
    <div class="theme-switch" role="group" aria-label="Theme">
      <button class="text-btn ul" data-option="light" type="button">Light</button>
      <span class="sep" aria-hidden="true">|</span>
      <button class="text-btn ul" data-option="dark" type="button">Dark</button>
    </div>
  </header>

  <main id="main">
    <section class="view" id="v-play"></section>
    <section class="view" id="v-games"></section>
    <section class="view" id="v-retake"></section>
    <section class="view" id="v-settings"></section>
  </main>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="play"><span class="label ul">Play</span></button>
    <button class="tab" data-tab="games"><span class="label ul">Games</span></button>
    <button class="tab" data-tab="retake"><span class="label ul">Puzzles</span></button>
    <button class="tab" data-tab="settings"><span class="label ul">Settings</span></button>
  </nav>
</div>
<div class="lights" aria-hidden="true"></div>
<div id="sheet-root"></div>
<noscript><p style="padding:24px">Chess needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
